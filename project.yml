name: ListenBrainzNative

options:
  bundleIdPrefix: dev.nabekhan
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ListenBrainzKit:
    path: Packages/ListenBrainzKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  ListenBrainzNative:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ListenBrainzKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nabekhan.listenbrainznative
        PRODUCT_NAME: Brainz
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brainz
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  ListenBrainzNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ListenBrainzNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nabekhan.listenbrainznative.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Brainz.app/Brainz"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ListenBrainzNative:
    build:
      targets:
        ListenBrainzNative: all
        ListenBrainzNativeTests: [test]
    test:
      targets:
        - ListenBrainzNativeTests
